<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJRM FINAL TID BASE</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:8px}.card{background:#1e293b;border-radius:16px;padding:12px;margin:8px auto;max-width:1200px;border:1px solid #334155;overflow:auto}input{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-top:6px}button{width:100%;padding:10px;border-radius:10px;border:0;background:#22c55e;color:#000;font-weight:800;margin-top:6px}button.sec{background:#0f172a;color:#e2e8f0;border:1px solid #334155;width:auto;padding:7px 12px}.upload{border:2px dashed #334155;padding:10px;border-radius:12px;text-align:center;margin:6px 0;background:#0f172a;display:inline-block;width:32%;vertical-align:top;font-size:11px}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}th,td{border:1px solid #334155;padding:6px;white-space:nowrap}th{background:#0f172a;color:#94a3b8}.fhr{color:#22c55e;font-weight:800;cursor:pointer}.del{color:#22c55e;font-weight:700}.hd{color:#facc15;font-weight:700}</style></head><body>
<div id="login" class="card" style="max-width:400px"><h2 style="text-align:center">🔐 RJRM LOGIN</h2><input id="fid" placeholder="FHR ID / 9086711490"><input id="pwd" type="password" placeholder="Pass"><button onclick="doLogin()">Login</button><p id="err" style="color:#f87171;text-align:center"></p></div>
<div id="admin" style="display:none"><div class="card"><h3 style="text-align:center">📤 ADMIN 9086711490</h3><div style="text-align:center"><div class="upload"><b>1. DELIVERY</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'opd')"><div id="s1"></div></div><div class="upload"><b>2. IMD</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'mid')"><div id="s2"></div></div><div class="upload"><b>3. SALARY</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'loss')"><div id="s3"></div></div></div><button class="sec" onclick="logout()">Logout</button></div>
<div class="card"><h3>ALL BM - OFD (Repeated) | DEL (TID Unique) | HD (TID Unique) | CONV</h3><div style="overflow:auto;max-height:70vh"><table><thead><tr><th>#</th><th>FHRID</th><th>Name</th><th>OFD (Rep)</th><th>DEL (TID)</th><th>HD (TID)</th><th>CONV</th><th>Salary</th><th>Loss</th><th>Net</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<div id="dash" style="display:none"><div class="card" style="max-width:500px"><h3 id="name"></h3><div id="t-del"><table><tr><th>OFD (Repeated)</th><td id="d_ofd">0</td></tr><tr><th>DEL (Unique TID)</th><td id="d_del" class="del">0</td></tr><tr><th>HD (Unique TID)</th><td id="d_hd" class="hd">0</td></tr><tr><th>CONV</th><td id="d_conv">0%</td></tr></table><div style="margin-top:10px;background:#0f172a;padding:10px;border-radius:10px"><div style="display:flex;justify-content:space-between;padding:6px 0"><span>Total Salary (OFD x 35)</span><b id="x2" style="color:#22c55e">₹0</b></div><div style="display:flex;justify-content:space-between;padding:6px 0"><span>Loss Kata</span><b id="x3" style="color:#f87171">₹0</b></div><div style="display:flex;justify-content:space-between;padding:10px 0"><span style="font-weight:800">Net Pay</span><b id="x4" style="color:#facc15;font-size:18px">₹0</b></div></div></div><button class="sec" onclick="backToAdmin()">⬅️ Back</button></div></div>
<script>
const ADMIN_ID='9086711490',ADMIN_PWD='9086711490';let DB=JSON.parse(localStorage.getItem('rjrm_db')||'{"opd":{},"mid":{},"loss":{}}');
function doLogin(){let id=document.getElementById('fid').value.trim(),pwd=document.getElementById('pwd').value.trim();if(id===ADMIN_ID){if(pwd===ADMIN_PWD){document.getElementById('login').style.display='none';document.getElementById('admin').style.display='block';renderTable();}else document.getElementById('err').innerText='Wrong';}else{if(!DB.opd[id]){document.getElementById('err').innerText='ID not found';return}document.getElementById('login').style.display='none';openDash(id);}}
function loadFile(inp,type){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){let wb=XLSX.read(e.target.result,{type:'binary'});let ws=wb.Sheets[wb.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(ws);parseRows(rows,type,f.name);};r.readAsBinaryString(f);}
function parseRows(rows,type,name){
if(type=='opd'){let map={};rows.forEach(r=>{let keys=Object.keys(r);let fhrK=keys.find(k=>k.toLowerCase().includes('fhr'));let fhr=fhrK?r[fhrK]:null;if(!fhr)return;fhr=String(fhr).trim();let tidK=keys.find(k=>k.toLowerCase().includes('track')||k.toLowerCase().includes('awb')||k.toLowerCase().includes('shipment')||k.toLowerCase().includes('tid'));let tid=tidK?String(r[tidK]).trim():Math.random().toString();let status=(r.ShipmentStatus||r.Status||r['Status']||'').toString().toLowerCase();if(!map[fhr])map[fhr]={total:0,tidSet:new Set(),delSet:new Set(),hdSet:new Set(),name:r.AgentName||'',hub:r.DeliveryHub||''};map[fhr].total++;map[fhr].tidSet.add(tid);if(status.includes('heavy')||status.includes('hd')||status.includes('overweight')){map[fhr].hdSet.add(tid);}if(status.includes('delivered')||status.includes('picked_complete')||status.includes('picked')||status.includes('delivery')){if(!status.includes('heavy'))map[fhr].delSet.add(tid);}});let final={};for(let id in map){final[id]={total:map[id].total,del:map[id].delSet.size,hd:map[id].hdSet.size,tids:map[id].tidSet.size,name:map[id].name,hub:map[id].hub};}DB.opd=final;}
else if(type=='mid'){let map={};rows.forEach(r=>{let fk=Object.keys(r).find(k=>k.toLowerCase().includes('fhr'));let fhr=fk?r[fk]:null;if(!fhr)return;fhr=String(fhr).trim();let amtK=Object.keys(r).find(k=>k.toLowerCase().includes('amount'));let amt=amtK?parseFloat(r[amtK])||0:0;if(!map[fhr])map[fhr]={cnt:0,amt:0};map[fhr].cnt++;map[fhr].amt+=amt;});DB.mid=map;}
else{let map={};rows.forEach(r=>{let fk=Object.keys(r).find(k=>k.toLowerCase().includes('fhr'));let fhr=fk?r[fk]:null;if(!fhr)return;fhr=String(fhr).trim();let amtK=Object.keys(r).find(k=>k.toLowerCase().includes('amount'));map[fhr]={loss:amtK?parseFloat(r[amtK])||0:0};});DB.loss=map;}
localStorage.setItem('rjrm_db',JSON.stringify(DB));document.getElementById('s'+(type=='opd'?1:type=='mid'?2:3)).innerHTML='✅ '+name;renderTable();}
function renderTable(){let tbody=document.getElementById('tbody');tbody.innerHTML='';let ids=Object.keys(DB.opd).sort((a,b)=>DB.opd[b].total-DB.opd[a].total);ids.forEach((id,i)=>{let d=DB.opd[id];let imd=DB.mid[id]||{amt:0};let loss=DB.loss[id]||{loss:0};let conv=d.total?((d.del/d.total)*100).toFixed(1)+'%':'0%';let gross=d.total*35;let tl=imd.amt+loss.loss;let net=gross-tl;tbody.innerHTML+='<tr><td>'+(i+1)+'</td><td class="fhr" onclick="openDash(\''+id+'\')">'+id+'</td><td>'+d.name+'</td><td>'+d.total+'</td><td class="del">'+d.del+'</td><td class="hd">'+d.hd+'</td><td>'+conv+'</td><td>₹'+gross+'</td><td>₹'+tl+'</td><td style="color:#facc15">₹'+net+'</td></tr>';});}
function openDash(id){let d=DB.opd[id];let imd=DB.mid[id]||{amt:0};let sl=DB.loss[id]||{loss:0};document.getElementById('admin').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('login').style.display='none';document.getElementById('name').innerText=d.name+' - '+id+' | Unique TID: '+d.tids;document.getElementById('d_ofd').innerText=d.total+' (Repeated)';document.getElementById('d_del').innerText=d.del+' (Unique TID)';document.getElementById('d_hd').innerText=d.hd+' (Unique TID)';document.getElementById('d_conv').innerText=d.total?((d.del/d.total)*100).toFixed(1)+'%':'';let gross=d.total*35;let tl=imd.amt+sl.loss;document.getElementById('x2').innerText='₹'+gross;document.getElementById('x3').innerText='₹'+tl;document.getElementById('x4').innerText='₹'+(gross-tl);}
function backToAdmin(){document.getElementById('dash').style.display='none';document.getElementById('admin').style.display='block';renderTable();}
function logout(){document.getElementById('admin').style.display='none';document.getElementById('dash').style.display='none';document.getElementById('login').style.display='block';}
renderTable();
</script></body></html>
