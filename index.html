<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJRM FINAL</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{font-family:system-ui;background:#0f172a;color:#e2e8f0;margin:0;padding:12px}.card{background:#1e293b;border-radius:16px;padding:18px;margin:12px auto;max-width:700px;border:1px solid #334155}input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:16px;margin-top:8px}button{width:100%;padding:14px;border-radius:10px;border:0;background:#22c55e;color:#000;font-weight:800;margin-top:10px}button.sec{background:#0f172a;color:#e2e8f0;border:1px solid #334155}.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.kpi div{background:#0f172a;padding:12px;border-radius:12px;text-align:center;border:1px solid #283449}.kpi b{display:block;font-size:18px;margin-top:4px}.upload{border:2px dashed #334155;padding:16px;border-radius:12px;text-align:center;margin:10px 0;background:#0f172a}.tab{display:flex;gap:6px;overflow:auto;padding:8px 0}.tab button{width:auto;padding:10px 14px;font-size:11px}.tab button.active{background:#22c55e;color:#000}.list button{width:auto;display:inline-block;margin:4px;padding:8px 12px;font-size:12px}</style></head><body>
<div id="login" class="card"><h2 style="text-align:center">🔐 RJRM LOGIN</h2><input id="fid" placeholder="FHR ID / Admin ID"><input id="pwd" type="password" placeholder="Password"><button onclick="doLogin()">Login</button><p id="err" style="color:#f87171;text-align:center"></p><p style="font-size:11px;color:#64748b;text-align:center">Admin: 9086711490 / 9086711490<br>BM: Apna FHR ID</p></div>
<div id="admin" class="card" style="display:none"><h2 style="text-align:center">📤 ADMIN UPLOAD</h2>
<div class="upload"><b>1. DELIVERY DATA</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'opd')"><div id="s1"></div></div>
<div class="upload"><b>2. IMD CASE DATA</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'mid')"><div id="s2"></div></div>
<div class="upload"><b>3. SALARY DATA</b><input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this,'loss')"><div id="s3"></div></div>
<div id="summary" style="display:none;background:#0f172a;padding:12px;border-radius:10px;margin-top:12px;border:1px solid #22c55e"></div>
<div id="idList" style="margin-top:12px;background:#0f172a;padding:12px;border-radius:10px"></div>
<button class="sec" onclick="logout()">Logout</button></div>
<div id="dash" style="display:none"><div class="card"><h3 id="name"></h3><p id="meta" style="font-size:12px;color:#94a3b8"></p>
<div class="tab"><button class="active" onclick="showTab('del',this)">📦 DELIVERY</button><button onclick="showTab('loss',this)">⚠️ IMD CASE</button><button onclick="showTab('sal',this)">💰 SALARY</button></div>
<div id="t-del" class="t"><div class="kpi"><div><span>Delivered</span><b id="d1" style="color:#22c55e">0</b></div><div><span>RTO</span><b id="d2" style="color:#f87171">0</b></div><div><span>Delivery %</span><b id="d3">0%</b></div><div><span>Picked</span><b id="d4">0</b></div><div><span>Total</span><b id="d5">0</b></div><div><span>Pending</span><b id="d6">0</b></div></div></div>
<div id="t-loss" class="t" style="display:none"><div class="kpi"><div><span>IMD Amount</span><b id="l1" style="color:#f87171">₹0</b></div><div><span>Count</span><b id="l2">0</b></div><div><span>Value</span><b id="l3">₹0</b></div></div></div>
<div id="t-sal" class="t" style="display:none"><div style="background:#0f172a;padding:12px;border-radius:10px"><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Total</span><b id="x1">0</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Gross</span><b id="x2">₹0</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>IMD Cut</span><b id="x3">₹0</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>Net</span><b id="x4" style="color:#facc15;font-size:18px">₹0</b></div></div></div>
<button class="sec" onclick="backToAdmin()">⬅️ Back</button><button class="sec" onclick="logout()">Logout</button></div></div>
<script>
const ADMIN_ID='9086711490',ADMIN_PWD='9086711490';let DB=JSON.parse(localStorage.getItem('rjrm_db')||'{"opd":{},"mid":{},"loss":{}}');
function doLogin(){let id=document.getElementById('fid').value.trim(),pwd=document.getElementById('pwd').value.trim();if(id===ADMIN_ID){if(pwd===ADMIN_PWD){document.getElementById('login').style.display='none';document.getElementById('admin').style.display='block';refreshAdmin();}else document.getElementById('err').innerText='Galat Password';}else{if(!DB.opd[id]){document.getElementById('err').innerText='ID nahi mili: '+id+' - Admin se pehle upload karo. Available: '+Object.keys(DB.opd).join(', ');return}document.getElementById('login').style.display='none';openDash(id);}}
function loadFile(inp,type){let file=inp.files[0];if(!file)return;document.getElementById('s'+(type=='opd'?1:type=='mid'?2:3)).innerHTML='⏳ '+file.name;let r=new FileReader();r.onload=function(e){let wb=XLSX.read(e.target.result,{type:'binary'});let ws=wb.Sheets[wb.SheetNames[0]];let rows=XLSX.utils.sheet_to_json(ws);parseRows(rows,type,file.name);};r.readAsBinaryString(file);}
function parseRows(rows,type,name){if(type=='opd'){let map={};rows.forEach(r=>{let k=Object.keys(r).find(k=>k.toLowerCase().includes('fhr'));let fhr=k?r[k]:null;let status=(r.ShipmentStatus||'').toString();let price=parseFloat(r.ShipmentPrice||0)||0;if(!fhr)return;fhr=String(fhr).trim();if(!map[fhr])map[fhr]={total:0,picked:0,notpicked:0,value:0,name:r.AgentName||'',hub:r.DeliveryHub||'',city:r.City||''};map[fhr].total++;map[fhr].value+=price;if(status.toLowerCase().includes('picked_complete'))map[fhr].picked++;else map[fhr].notpicked++;});DB.opd=map;}else{let map={};rows.forEach(r=>{let k=Object.keys(r).find(k=>k.toLowerCase().includes('fhr'));let fhr=k?r[k]:Object.values(r)[0];if(!fhr)return;fhr=String(fhr).trim();map[fhr]={lossAmt:parseFloat(Object.values(r)[1]||0)||0,lossCount:1,imd:0};});if(type=='mid')DB.mid=map;else DB.loss=map;}localStorage.setItem('rjrm_db',JSON.stringify(DB));document.getElementById('s'+(type=='opd'?1:type=='mid'?2:3)).innerHTML='✅ '+name+' - '+Object.keys(DB[type]).length+' IDs';refreshAdmin();}
function refreshAdmin(){let c=Object.keys(DB.opd).length;if(c>0){document.getElementById('summary').style.display='block';document.getElementById('summary').innerHTML='DELIVERY='+c+' | IMD='+Object.keys(DB.mid).length+' | SALARY='+Object.keys(DB.loss).length;let h='<b>BM IDs - Click to View:</b><br>';Object.keys(DB.opd).forEach(id=>{h+='<button onclick="openDash(\''+id+'\')" style="width:auto;display:inline-block;margin:4px;padding:8px 12px;font-size:12px">'+id+'</button> '});document.getElementById('idList').innerHTML=h;}}
function openDash(id){let d=DB.opd[id];if(!d){alert('Not found');return}document.getElementById('admin').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('login').style.display='none';document.getElementById('name').innerText=(d.name||'Agent')+' - '+id;document.getElementById('meta').innerText=d.hub||'';document.getElementById('d4').innerText=d.picked;document.getElementById('d5').innerText=d.total;document.getElementById('d6').innerText=d.total-d.picked;document.getElementById('d1').innerText=d.picked;document.getElementById('d2').innerText=d.notpicked;document.getElementById('d3').innerText=d.total?Math.round((d.picked/d.total)*100)+'%':'0%';document.getElementById('x1').innerText=d.total;let gross=d.total*35;let loss=DB.loss[id]?DB.loss[id].lossAmt:0;document.getElementById('x2').innerText='₹'+gross;document.getElementById('x3').innerText='₹'+loss;document.getElementById('x4').innerText='₹'+(gross-loss);document.getElementById('l1').innerText='₹'+loss;showTab('del',document.querySelector('.tab button'));}
function showTab(id,btn){document.querySelectorAll('.t').forEach(t=>t.style.display='none');document.getElementById('t-'+id).style.display='block';document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function backToAdmin(){document.getElementById('dash').style.display='none';document.getElementById('admin').style.display='block';refreshAdmin();}
function logout(){document.getElementById('admin').style.display='none';document.getElementById('dash').style.display='none';document.getElementById('login').style.display='block';}
refreshAdmin();
</script></body></html>
